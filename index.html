<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <link rel="stylesheet" href="music.css">
</head>

<body>
    <div class="header">
        <h1>Music App</h1>
        <p>Press keys to play music</p>
        <div class="controls">
            <button id="btn-record">Record</button>
            <button id="btn-play" disabled>Play</button>
        </div>
    </div>
    <div id="buttons">

        <button id="D" class="key white">D</button>
        <button id="F" class="key black">F</button>
        <button id="G" class="key white">G</button>
        <button id="H" class="key black">H</button>
        <button id="I" class="key white">I</button>
        <button id="J" class="key white">J</button>
        <button id="K" class="key black">K</button>
        <button id="L" class="key white">L</button>
        <button id="M" class="key black">M</button>
        <button id="N" class="key white">N</button>
        <button id="O" class="key black">O</button>
        <button id="P" class="key white">P</button>


        <button id="Q" class="key white">Q</button>
        <button id="R" class="key black">R</button>
        <button id="S" class="key white">S</button>
        <button id="T" class="key black">T</button>
        <button id="U" class="key white">U</button>
        <button id="V" class="key white">V</button>
        <button id="W" class="key black">W</button>
        <button id="X" class="key white">X</button>
        <button id="Y" class="key black">Y</button>
        <button id="Z" class="key white">Z</button>
        <button id="A" class="key black">A</button>
        <button id="C" class="key white">C</button>
    </div>
    <script src="music.js"></script>
</body>

</html>
